<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>BOXPVPKRALLARI - Sunucu</title>
  <style>/* styles omitted for brevity - unchanged from previous version */</style>
</head>
<body>
  <!-- (body content omitted for brevity) -->
  <!-- Only the scripts below are relevant changes: admin password modal and form submit -> create_issue -->

  <div id="adminPwdOverlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.6);align-items:center;justify-content:center;z-index:9999">
    <div style="background:#0b1b11;padding:18px;border-radius:10px;width:90%;max-width:420px;color:var(--muted)">
      <h3>Admin Şifre ile Giriş</h3>
      <p>Şifre: q1w2e3r4</p>
      <input id="adminPwdInput" type="password" placeholder="Şifre" style="width:100%;padding:10px;margin-top:8px;border-radius:6px;background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.03);color:var(--muted)" />
      <div style="display:flex;gap:8px;margin-top:8px;justify-content:flex-end">
        <button id="adminPwdCancel" style="padding:8px 10px;border-radius:6px">İptal</button>
        <button id="adminPwdSubmit" style="padding:8px 10px;border-radius:6px;background:#68c04b;border:none">Giriş</button>
      </div>
      <div id="adminPwdMsg" style="margin-top:8px;font-size:13px;color:var(--muted)"></div>
    </div>
  </div>

  <script>
    // Existing variables and functions omitted for brevity - we only show the modified parts

    // Show password modal when adminNav clicked
    document.getElementById('adminNav').addEventListener('click', (e) => {
      e.preventDefault();
      document.getElementById('adminPwdOverlay').style.display = 'flex';
      document.getElementById('adminPwdInput').value = '';
      document.getElementById('adminPwdInput').focus();
    });
    document.getElementById('adminPwdCancel').addEventListener('click', ()=>{ document.getElementById('adminPwdOverlay').style.display='none'; });

    document.getElementById('adminPwdSubmit').addEventListener('click', async ()=>{
      const pwd = document.getElementById('adminPwdInput').value || '';
      try{
        const res = await fetch('/.netlify/functions/admin_auth', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: pwd }) });
        if(res.ok){
          document.getElementById('adminPwdMsg').textContent = 'Giriş başarılı. Yönlendiriliyorsunuz...';
          document.getElementById('adminPwdOverlay').style.display='none';
          // re-check auth to show admin panel
          setTimeout(()=> checkAuth(), 500);
        } else {
          const j = await res.json().catch(()=>({}));
          document.getElementById('adminPwdMsg').textContent = j.message || 'Giriş başarısız.';
        }
      }catch(err){ console.error(err); document.getElementById('adminPwdMsg').textContent = 'Sunucu hatası.'; }
    });

    // Replace whitelist form submit to create_issue function
    const whitelistForm = document.getElementById('whitelistForm');
    whitelistForm.addEventListener('submit', async (e)=>{
      e.preventDefault();
      const mcname = whitelistForm.mcname.value.trim();
      const reason = whitelistForm.reason.value.trim();
      const experience = whitelistForm.experience.value.trim();
      if(!mcname || !reason){ alert('Lütfen gerekli alanları doldurun.'); return; }

      try{
        const res = await fetch('/.netlify/functions/create_issue', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ mcname, reason, experience }) });
        const json = await res.json();
        if(res.ok){
          alert('Başvurunuz oluşturuldu: ' + (json.url || '')); whitelistForm.reset();
        } else {
          throw new Error(json.error || 'Başvuru oluşturulamadı');
        }
      }catch(err){
        console.error(err);
        // fallback: copy to clipboard
        const text = `Whitelist Başvurusu\n\nKullanıcı adı: ${mcname}\n\nNeden katılmak istiyorsun?: ${reason}\n\nDeneyim: ${experience}`;
        try{ await navigator.clipboard.writeText(text); alert('Sunucuya ulaşılamadı. Başvuru metni panoya kopyalandı.'); }catch(e){ alert('Sunucu hatası ve kopyalama yapılamadı.'); }
      }
    });
  </script>
</body>
</html>
